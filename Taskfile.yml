version: '3'

tasks:
  default:
    cmds:
      - task: tidy
      - task: build
      - task: example

  tidy:
    cmds:
      - go mod tidy -v
      - cd _example/groups && go mod tidy -v
      - cd _example/subcommands && go mod tidy -v

  build:
    cmds:
      - go build .
      - cd _example/groups && go build -o example
      - cd _example/subcommands && go build -o example

  example:
    cmds:
      - |
        ./_example/groups/example markdown > _example/groups/_markdown.md

      - |
        ./_example/groups/example man > _example/groups/_manpage.tmp
        (
          echo '```'
          COLUMNS=90 man -l ./_example/groups/_manpage.tmp
          echo '```'
        ) > _example/groups/_manpage.md
        rm _example/groups/_manpage.tmp

      - |
        ./_example/subcommands/example docs markdown > _example/subcommands/_markdown.md

      - |
        ./_example/subcommands/example docs man > _example/subcommands/_manpage.tmp
        (
          echo '```'
          COLUMNS=90 man -l ./_example/subcommands/_manpage.tmp
          echo '```'
        ) > _example/subcommands/_manpage.md
        rm _example/subcommands/_manpage.tmp

  fmt:
    cmds:
      - gofmt -s -w . ./_example/groups ./_example/subcommands

  md:
    cmds:
      - md-authors --format modern --append AUTHORS.md
